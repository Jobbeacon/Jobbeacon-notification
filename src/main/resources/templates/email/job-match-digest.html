<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title th:text="${notification.title}">Việc làm phù hợp</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 16px;font-size:16px;"
           th:text="${displayName != null ? 'Xin chào ' + displayName + ',' : 'Xin chào,'}">Xin chào,</p>
        <h1 style="margin:0 0 16px;font-size:20px;" th:text="${notification.title}">Có 5 việc làm phù hợp với bạn</h1>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr th:each="job : ${payload['jobs']}">
            <td style="padding:12px 0;border-top:1px solid #e4e7eb;"
                th:with="url=${job['url'] != null and !#strings.isEmpty('' + job['url']) ? '' + job['url'] : null},
                         jobId=${job['job_id'] != null and !#strings.isEmpty('' + job['job_id']) ? #strings.trim('' + job['job_id']) : null},
                         link=${url != null ? #strings.trim(url) : (jobId != null ? frontendUrl + '/jobs/' + #uris.escapePathSegment(jobId) : null)}">
              <a th:if="${link != null}" th:href="${link}"
                 th:text="${job['title']}" style="font-size:15px;font-weight:bold;color:#1d4ed8;text-decoration:none;">Tên việc làm</a>
              <span th:unless="${link != null}"
                    th:text="${job['title']}" style="font-size:15px;font-weight:bold;color:#1f2933;">Tên việc làm</span>
              <div th:if="${job['company'] != null}" th:text="${job['company']}" style="font-size:13px;color:#52606d;margin-top:4px;">Công ty</div>
            </td>
          </tr>
        </table>
        <p style="margin:24px 0 0;">
          <a th:href="${frontendUrl + '/jobs'}" style="display:inline-block;padding:10px 16px;background:#1d4ed8;color:#ffffff;border-radius:6px;text-decoration:none;">Xem thêm việc làm</a>
        </p>
        <p style="margin:24px 0 0;font-size:12px;color:#7b8794;">
          Bạn nhận email này vì đang bật thông báo việc làm phù hợp trên JobBeacon. Có thể tắt trong phần cài đặt thông báo.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
