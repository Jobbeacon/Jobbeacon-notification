<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <title th:text="${notification.title}">Chào mừng bạn đến với JobBeacon</title>
</head>
<body style="margin:0;padding:24px;background:#f5f6f8;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;">
    <tr>
      <td style="padding:24px;">
        <p style="margin:0 0 16px;font-size:16px;"
           th:text="${displayName != null ? 'Xin chào ' + displayName + ',' : 'Xin chào,'}">Xin chào,</p>
        <h1 style="margin:0 0 16px;font-size:20px;" th:text="${notification.title}">Chào mừng bạn đến với JobBeacon</h1>
        <p style="margin:0 0 12px;font-size:15px;line-height:1.5;">
          Tài khoản của bạn đã sẵn sàng. Hãy hoàn thiện hồ sơ và tải CV lên để JobBeacon gợi ý những việc làm phù hợp nhất với bạn.
        </p>
        <p style="margin:24px 0 0;">
          <a th:href="${frontendUrl}" style="display:inline-block;padding:10px 16px;background:#1d4ed8;color:#ffffff;border-radius:6px;text-decoration:none;">Bắt đầu với JobBeacon</a>
        </p>
        <p style="margin:24px 0 0;font-size:12px;color:#7b8794;">
          Bạn nhận email này vì vừa tạo tài khoản trên JobBeacon.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
